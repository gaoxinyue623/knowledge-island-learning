<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">图形运动与轴对称</title><desc id="desc">三个独立区域：朝向不变的平移、绕固定中心转动的旋转、两侧镜像的轴对称。</desc><defs>
<marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#577969"/></marker>
<g id="duck"><ellipse cx="0" cy="10" rx="30" ry="19" fill="#fff0a8" stroke="#b1903b" stroke-width="2"/><circle cx="19" cy="-12" r="17" fill="#fff0a8" stroke="#b1903b" stroke-width="2"/><path d="M34,-15 L50,-10 L34,-5 Z" fill="#e99343"/><circle cx="24" cy="-16" r="3" fill="#384e45"/><path d="M-8,8 Q7,-3 17,10 Q4,22 -8,8" fill="#ead279"/></g>
<g id="rabbit"><ellipse cx="0" cy="0" rx="24" ry="26" fill="#f4e8d9" stroke="#927961" stroke-width="2"/><ellipse cx="-11" cy="-32" rx="8" ry="21" fill="#f4e8d9" stroke="#927961" stroke-width="2"/><ellipse cx="11" cy="-32" rx="8" ry="21" fill="#f4e8d9" stroke="#927961" stroke-width="2"/><circle cx="-8" cy="-4" r="3" fill="#384e45"/><circle cx="8" cy="-4" r="3" fill="#384e45"/><path d="M-3,4 L3,4 L0,9 Z" fill="#d58d88"/></g>
<g id="shape-arrow"><path d="M-48,-18 L10,-18 L10,-38 L52,0 L10,38 L10,18 L-48,18 Z" fill="currentColor" stroke="#385849" stroke-width="3"/></g>
<g id="cube"><path d="M0,-35 L40,-15 L0,5 L-40,-15 Z" fill="#f2d68d"/><path d="M-40,-15 L0,5 L0,48 L-40,28 Z" fill="#d8aa63"/><path d="M0,5 L40,-15 L40,28 L0,48 Z" fill="#ead099"/><path d="M0,-35 L40,-15 L40,28 L0,48 L-40,28 L-40,-15 Z M-40,-15 L0,5 L40,-15 M0,5 L0,48" fill="none" stroke="#8b7048" stroke-width="3"/></g>
</defs>
<rect width="1200" height="800" fill="#f6f8f1"/><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#304c3e"><text x="60" y="75" font-size="40" >比较位置、朝向与对称</text><rect x="40" y="145" width="350" height="570" rx="22" fill="#ffffff" stroke="#d7e1d9" stroke-width="2"/><rect x="425" y="145" width="350" height="570" rx="22" fill="#ffffff" stroke="#d7e1d9" stroke-width="2"/><rect x="810" y="145" width="350" height="570" rx="22" fill="#ffffff" stroke="#d7e1d9" stroke-width="2"/><text x="215" y="205" font-size="32" text-anchor="middle">平移</text><use href="#shape-arrow" x="130" y="370" color="#9cc4ae"/><use href="#shape-arrow" x="285" y="370" color="#e5b759"/><path d="M130,470 H285" stroke="#577969" stroke-width="4" marker-end="url(#arrowhead)"/><text x="600" y="205" font-size="32" text-anchor="middle">旋转</text><circle cx="600" cy="435" r="7" fill="#304c3e"/><use href="#shape-arrow" transform="translate(600 435) translate(0 -125)" color="#9cc4ae"/><use href="#shape-arrow" transform="translate(600 435) rotate(90) translate(0 -125)" color="#e5b759"/><path d="M600,260 A175,175 0 0 1 775,435" stroke="#577969" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/><text x="985" y="205" font-size="32" text-anchor="middle">轴对称</text><path d="M980,420 C820,245 820,620 980,480 Z M990,420 C1150,245 1150,620 990,480 Z" fill="#c3a3cf" stroke="#8d6b99" stroke-width="3"/><rect x="979" y="355" width="12" height="160" rx="6" fill="#6f6076"/><path d="M985,275 V640" stroke="#577969" stroke-width="3" stroke-dasharray="10 8"/></g></svg>