<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">正面图与摆放区域</title><desc id="desc">空的2×2摆放区域，第1行在下方；3个待摆放的同样大小正方体；正面图为并排的2个正方形。</desc><defs>
<marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#577969"/></marker>
<g id="duck"><ellipse cx="0" cy="10" rx="30" ry="19" fill="#fff0a8" stroke="#b1903b" stroke-width="2"/><circle cx="19" cy="-12" r="17" fill="#fff0a8" stroke="#b1903b" stroke-width="2"/><path d="M34,-15 L50,-10 L34,-5 Z" fill="#e99343"/><circle cx="24" cy="-16" r="3" fill="#384e45"/><path d="M-8,8 Q7,-3 17,10 Q4,22 -8,8" fill="#ead279"/></g>
<g id="rabbit"><ellipse cx="0" cy="0" rx="24" ry="26" fill="#f4e8d9" stroke="#927961" stroke-width="2"/><ellipse cx="-11" cy="-32" rx="8" ry="21" fill="#f4e8d9" stroke="#927961" stroke-width="2"/><ellipse cx="11" cy="-32" rx="8" ry="21" fill="#f4e8d9" stroke="#927961" stroke-width="2"/><circle cx="-8" cy="-4" r="3" fill="#384e45"/><circle cx="8" cy="-4" r="3" fill="#384e45"/><path d="M-3,4 L3,4 L0,9 Z" fill="#d58d88"/></g>
<g id="shape-arrow"><path d="M-48,-18 L10,-18 L10,-38 L52,0 L10,38 L10,18 L-48,18 Z" fill="currentColor" stroke="#385849" stroke-width="3"/></g>
<g id="cube"><path d="M0,-35 L40,-15 L0,5 L-40,-15 Z" fill="#f2d68d"/><path d="M-40,-15 L0,5 L0,48 L-40,28 Z" fill="#d8aa63"/><path d="M0,5 L40,-15 L40,28 L0,48 Z" fill="#ead099"/><path d="M0,-35 L40,-15 L40,28 L0,48 L-40,28 L-40,-15 Z M-40,-15 L0,5 L40,-15 M0,5 L0,48" fill="none" stroke="#8b7048" stroke-width="3"/></g>
</defs>
<rect width="1200" height="800" fill="#f6f8f1"/><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#304c3e"><text x="60" y="65" font-size="38" >按条件摆放小正方体</text><text x="60" y="115" font-size="27" >仅一层，每格最多 1 个；从第 1 行前方观察。</text><rect x="50" y="160" width="630" height="555" rx="22" fill="#ffffff" stroke="#d7e1d9" stroke-width="2"/><rect x="720" y="160" width="430" height="555" rx="22" fill="#ffffff" stroke="#d7e1d9" stroke-width="2"/><rect data-role="placement-cell" data-row="1" data-col="1" x="180" y="490" width="180" height="180" fill="white" stroke="#729985" stroke-width="3"/><text x="270" y="590" font-size="28" text-anchor="middle">(1,1)</text><rect data-role="placement-cell" data-row="1" data-col="2" x="360" y="490" width="180" height="180" fill="white" stroke="#729985" stroke-width="3"/><text x="450" y="590" font-size="28" text-anchor="middle">(2,1)</text><rect data-role="placement-cell" data-row="2" data-col="1" x="180" y="310" width="180" height="180" fill="white" stroke="#729985" stroke-width="3"/><text x="270" y="410" font-size="28" text-anchor="middle">(1,2)</text><rect data-role="placement-cell" data-row="2" data-col="2" x="360" y="310" width="180" height="180" fill="white" stroke="#729985" stroke-width="3"/><text x="450" y="410" font-size="28" text-anchor="middle">(2,2)</text><text x="365" y="235" font-size="28" text-anchor="middle">摆放区域（列，行）</text><text x="365" y="760" font-size="27" text-anchor="middle">从这里向上看</text><path d="M365,725 V675" stroke="#577969" stroke-width="4" marker-end="url(#arrowhead)"/><text x="935" y="215" font-size="27" text-anchor="middle">使用这些小正方体</text><use data-role="loose-cube" href="#cube" x="805" y="310"/><use data-role="loose-cube" href="#cube" x="935" y="310"/><use data-role="loose-cube" href="#cube" x="1065" y="310"/><text x="935" y="460" font-size="27" text-anchor="middle">要求看到的正面图</text><rect data-role="front-square" x="855" y="500" width="80" height="80" fill="#efd49d" stroke="#8b7048" stroke-width="3"/><rect data-role="front-square" x="935" y="500" width="80" height="80" fill="#efd49d" stroke="#8b7048" stroke-width="3"/><text x="935" y="660" font-size="23" text-anchor="middle">在左边方格中想一想怎样摆。</text></g></svg>