<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">动物聚会情景</title><desc id="desc">4张桌子，每桌2只小动物；下方单独表示后来又来1只。</desc><defs>
<marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#577969"/></marker>
<g id="duck"><ellipse cx="0" cy="10" rx="30" ry="19" fill="#fff0a8" stroke="#b1903b" stroke-width="2"/><circle cx="19" cy="-12" r="17" fill="#fff0a8" stroke="#b1903b" stroke-width="2"/><path d="M34,-15 L50,-10 L34,-5 Z" fill="#e99343"/><circle cx="24" cy="-16" r="3" fill="#384e45"/><path d="M-8,8 Q7,-3 17,10 Q4,22 -8,8" fill="#ead279"/></g>
<g id="rabbit"><ellipse cx="0" cy="0" rx="24" ry="26" fill="#f4e8d9" stroke="#927961" stroke-width="2"/><ellipse cx="-11" cy="-32" rx="8" ry="21" fill="#f4e8d9" stroke="#927961" stroke-width="2"/><ellipse cx="11" cy="-32" rx="8" ry="21" fill="#f4e8d9" stroke="#927961" stroke-width="2"/><circle cx="-8" cy="-4" r="3" fill="#384e45"/><circle cx="8" cy="-4" r="3" fill="#384e45"/><path d="M-3,4 L3,4 L0,9 Z" fill="#d58d88"/></g>
<g id="shape-arrow"><path d="M-48,-18 L10,-18 L10,-38 L52,0 L10,38 L10,18 L-48,18 Z" fill="currentColor" stroke="#385849" stroke-width="3"/></g>
<g id="cube"><path d="M0,-35 L40,-15 L0,5 L-40,-15 Z" fill="#f2d68d"/><path d="M-40,-15 L0,5 L0,48 L-40,28 Z" fill="#d8aa63"/><path d="M0,5 L40,-15 L40,28 L0,48 Z" fill="#ead099"/><path d="M0,-35 L40,-15 L40,28 L0,48 L-40,28 L-40,-15 Z M-40,-15 L0,5 L40,-15 M0,5 L0,48" fill="none" stroke="#8b7048" stroke-width="3"/></g>
</defs>
<rect width="1200" height="800" fill="#f6f8f1"/><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#304c3e"><text x="60" y="75" font-size="40" >动物聚会</text><text x="60" y="125" font-size="28" >先观察桌旁的小动物，再看后来发生了什么。</text><ellipse data-role="table" cx="310" cy="275" rx="105" ry="56" fill="#d8bc8b" stroke="#9c815d" stroke-width="3"/><use data-role="seated-animal" href="#rabbit" x="160" y="275"/><use data-role="seated-animal" href="#rabbit" x="460" y="275"/><ellipse data-role="table" cx="310" cy="465" rx="105" ry="56" fill="#d8bc8b" stroke="#9c815d" stroke-width="3"/><use data-role="seated-animal" href="#rabbit" x="160" y="465"/><use data-role="seated-animal" href="#rabbit" x="460" y="465"/><ellipse data-role="table" cx="855" cy="275" rx="105" ry="56" fill="#d8bc8b" stroke="#9c815d" stroke-width="3"/><use data-role="seated-animal" href="#rabbit" x="705" y="275"/><use data-role="seated-animal" href="#rabbit" x="1005" y="275"/><ellipse data-role="table" cx="855" cy="465" rx="105" ry="56" fill="#d8bc8b" stroke="#9c815d" stroke-width="3"/><use data-role="seated-animal" href="#rabbit" x="705" y="465"/><use data-role="seated-animal" href="#rabbit" x="1005" y="465"/><rect x="60" y="605" width="1080" height="145" rx="22" fill="#fff2dc" stroke="#d7e1d9" stroke-width="2"/><text x="100" y="675" font-size="30" >后来又来 1 只</text><use data-role="arriving-animal" href="#rabbit" x="630" y="683"/></g></svg>