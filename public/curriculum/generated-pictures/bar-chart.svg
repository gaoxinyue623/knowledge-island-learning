<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">条形统计图</title><desc id="desc">绘画8人、音乐12人、棋类6人，纵轴从0至14，每格2人。</desc><defs>
<marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#577969"/></marker>
<g id="duck"><ellipse cx="0" cy="10" rx="30" ry="19" fill="#fff0a8" stroke="#b1903b" stroke-width="2"/><circle cx="19" cy="-12" r="17" fill="#fff0a8" stroke="#b1903b" stroke-width="2"/><path d="M34,-15 L50,-10 L34,-5 Z" fill="#e99343"/><circle cx="24" cy="-16" r="3" fill="#384e45"/><path d="M-8,8 Q7,-3 17,10 Q4,22 -8,8" fill="#ead279"/></g>
<g id="rabbit"><ellipse cx="0" cy="0" rx="24" ry="26" fill="#f4e8d9" stroke="#927961" stroke-width="2"/><ellipse cx="-11" cy="-32" rx="8" ry="21" fill="#f4e8d9" stroke="#927961" stroke-width="2"/><ellipse cx="11" cy="-32" rx="8" ry="21" fill="#f4e8d9" stroke="#927961" stroke-width="2"/><circle cx="-8" cy="-4" r="3" fill="#384e45"/><circle cx="8" cy="-4" r="3" fill="#384e45"/><path d="M-3,4 L3,4 L0,9 Z" fill="#d58d88"/></g>
<g id="shape-arrow"><path d="M-48,-18 L10,-18 L10,-38 L52,0 L10,38 L10,18 L-48,18 Z" fill="currentColor" stroke="#385849" stroke-width="3"/></g>
<g id="cube"><path d="M0,-35 L40,-15 L0,5 L-40,-15 Z" fill="#f2d68d"/><path d="M-40,-15 L0,5 L0,48 L-40,28 Z" fill="#d8aa63"/><path d="M0,5 L40,-15 L40,28 L0,48 Z" fill="#ead099"/><path d="M0,-35 L40,-15 L40,28 L0,48 L-40,28 L-40,-15 Z M-40,-15 L0,5 L40,-15 M0,5 L0,48" fill="none" stroke="#8b7048" stroke-width="3"/></g>
</defs>
<rect width="1200" height="800" fill="#f6f8f1"/><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#304c3e"><text x="600" y="65" font-size="38" text-anchor="middle">兴趣小组人数统计图</text><text x="70" y="130" font-size="26" >人数（人）</text><path d="M160,650 H1100" stroke="#d6e1dc" stroke-width="2"/><text x="135" y="659" font-size="26" text-anchor="end">0</text><path d="M160,580 H1100" stroke="#d6e1dc" stroke-width="2"/><text x="135" y="589" font-size="26" text-anchor="end">2</text><path d="M160,510 H1100" stroke="#d6e1dc" stroke-width="2"/><text x="135" y="519" font-size="26" text-anchor="end">4</text><path d="M160,440 H1100" stroke="#d6e1dc" stroke-width="2"/><text x="135" y="449" font-size="26" text-anchor="end">6</text><path d="M160,370 H1100" stroke="#d6e1dc" stroke-width="2"/><text x="135" y="379" font-size="26" text-anchor="end">8</text><path d="M160,300 H1100" stroke="#d6e1dc" stroke-width="2"/><text x="135" y="309" font-size="26" text-anchor="end">10</text><path d="M160,230 H1100" stroke="#d6e1dc" stroke-width="2"/><text x="135" y="239" font-size="26" text-anchor="end">12</text><path d="M160,160 H1100" stroke="#d6e1dc" stroke-width="2"/><text x="135" y="169" font-size="26" text-anchor="end">14</text><path d="M160,155 V650 H1100" fill="none" stroke="#527565" stroke-width="4"/><rect data-category="绘画" data-value="8" x="285" y="370" width="150" height="280" fill="#79a890"/><text x="360" y="700" font-size="30" text-anchor="middle">绘画</text><rect data-category="音乐" data-value="12" x="565" y="230" width="150" height="420" fill="#e2b963"/><text x="640" y="700" font-size="30" text-anchor="middle">音乐</text><rect data-category="棋类" data-value="6" x="845" y="440" width="150" height="210" fill="#82adc6"/><text x="920" y="700" font-size="30" text-anchor="middle">棋类</text><text x="600" y="760" font-size="27" text-anchor="middle">每一格表示 2 人</text></g></svg>