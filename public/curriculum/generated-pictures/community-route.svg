<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">往返路线示意</title><desc id="desc">从家先向东200米，再向北300米到图书馆；图右侧标出北向。仅标去程，不画返回答案。</desc><defs>
<marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#577969"/></marker>
<g id="duck"><ellipse cx="0" cy="10" rx="30" ry="19" fill="#fff0a8" stroke="#b1903b" stroke-width="2"/><circle cx="19" cy="-12" r="17" fill="#fff0a8" stroke="#b1903b" stroke-width="2"/><path d="M34,-15 L50,-10 L34,-5 Z" fill="#e99343"/><circle cx="24" cy="-16" r="3" fill="#384e45"/><path d="M-8,8 Q7,-3 17,10 Q4,22 -8,8" fill="#ead279"/></g>
<g id="rabbit"><ellipse cx="0" cy="0" rx="24" ry="26" fill="#f4e8d9" stroke="#927961" stroke-width="2"/><ellipse cx="-11" cy="-32" rx="8" ry="21" fill="#f4e8d9" stroke="#927961" stroke-width="2"/><ellipse cx="11" cy="-32" rx="8" ry="21" fill="#f4e8d9" stroke="#927961" stroke-width="2"/><circle cx="-8" cy="-4" r="3" fill="#384e45"/><circle cx="8" cy="-4" r="3" fill="#384e45"/><path d="M-3,4 L3,4 L0,9 Z" fill="#d58d88"/></g>
<g id="shape-arrow"><path d="M-48,-18 L10,-18 L10,-38 L52,0 L10,38 L10,18 L-48,18 Z" fill="currentColor" stroke="#385849" stroke-width="3"/></g>
<g id="cube"><path d="M0,-35 L40,-15 L0,5 L-40,-15 Z" fill="#f2d68d"/><path d="M-40,-15 L0,5 L0,48 L-40,28 Z" fill="#d8aa63"/><path d="M0,5 L40,-15 L40,28 L0,48 Z" fill="#ead099"/><path d="M0,-35 L40,-15 L40,28 L0,48 L-40,28 L-40,-15 Z M-40,-15 L0,5 L40,-15 M0,5 L0,48" fill="none" stroke="#8b7048" stroke-width="3"/></g>
</defs>
<rect width="1200" height="800" fill="#f6f8f1"/><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#304c3e"><text x="60" y="70" font-size="40" >方向与路线</text><text x="60" y="120" font-size="28" >去程：先向东 200 米，再向北 300 米。</text><rect x="60" y="165" width="1080" height="570" rx="22" fill="#ffffff" stroke="#d7e1d9" stroke-width="2"/><path d="M360,650 H660 V200" fill="none" stroke="#79aa91" stroke-width="12" stroke-linejoin="round"/><path d="M445,650 H555" fill="none" stroke="#416b54" stroke-width="4" marker-end="url(#arrowhead)"/><path d="M660,535 V385" fill="none" stroke="#416b54" stroke-width="4" marker-end="url(#arrowhead)"/><circle cx="360" cy="650" r="12" fill="white" stroke="#426a54" stroke-width="4"/><circle cx="660" cy="650" r="12" fill="white" stroke="#426a54" stroke-width="4"/><circle cx="660" cy="200" r="12" fill="white" stroke="#426a54" stroke-width="4"/><text x="315" y="705" font-size="30" >家</text><text x="710" y="210" font-size="30" >图书馆</text><text x="510" y="705" font-size="32" text-anchor="middle">200 米</text><text x="705" y="455" font-size="32" >300 米</text><path d="M1030,320 V220" fill="none" stroke="#577969" stroke-width="4" marker-end="url(#arrowhead)"/><text x="1030" y="200" font-size="30" text-anchor="middle">北</text></g></svg>