<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F5F8FC" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/knowledge-dango.svg" />
    <title>知识岛</title>
    <style>
      .startup-panel {
        box-sizing: border-box;
        max-width: 420px;
        margin: 18vh auto;
        padding: 28px 24px;
        color: #284e40;
        font:
          16px/1.8 system-ui,
          sans-serif;
        text-align: center;
      }
      .startup-panel button {
        min-height: 44px;
        margin-top: 16px;
        padding: 8px 20px;
        border: 1px solid #315f50;
        border-radius: 12px;
        background: #315f50;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="startup-panel" role="status" aria-live="polite">
        <strong>正在打开你的小岛…</strong>
        <p>正在连接账号并准备学习页面，请稍候。</p>
      </div>
    </div>
    <noscript>知识岛需要启用 JavaScript 才能学习和保存进度。</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
